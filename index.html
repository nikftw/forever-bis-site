<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>Forever BiS</title>
	<style>
		:root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ec; --muted:#9aa3b2; --accent:#4cc38a; }
		body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, Segoe UI, sans-serif; }
		main { max-width:720px; margin:0 auto; padding:48px 16px; }
		h1 { margin:0 0 4px; font-size:26px; }
		p { color:var(--muted); margin:0 0 28px; }
		.card { display:block; padding:18px 20px; margin-bottom:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text); text-decoration:none; }
		.card:hover { border-color:var(--accent); }
		.card b { display:block; font-size:17px; margin-bottom:2px; }
		.card span { color:var(--muted); }
	</style>
</head>
<body>
	<main>
		<h1>Forever BiS</h1>
		<p>Pre-raid best in slot for WoW Forever, Alliance, simmed on the wowsims/forever engine.</p>
		<a class="card" href="tank/"><b>Tanks</b><span>Protection Paladin, Bear Druid, Protection Warrior</span></a>
		<a class="card" href="physical/"><b>Physical DPS</b><span>Fury, Arms, Rogue, Hunter, Retribution, Feral Cat</span></a>
		<a class="card" href="caster/"><b>Caster DPS</b><span>Mage, Warlock, Shadow Priest, Balance, Elemental</span></a>
	</main>
</body>
</html>
